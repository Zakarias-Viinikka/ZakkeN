[package]
name = "tmp_focus_test"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "MouseEvent", "Element", "DomRect", "CssStyleDeclaration", "ResizeObserver", "ResizeObserverEntry", "HtmlTextAreaElement", "HtmlElement", "console"] }
gloo-timers = { version = "0.3", features = ["futures"] }
rapier2d = "0.35.3"
js-sys = "0.3"
