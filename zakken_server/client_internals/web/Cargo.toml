[workspace]

[package]
name = "client_web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "console"] }
gloo-timers = { version = "0.4", features = ["futures"] }
server_protocol = { path = "../../shared/server_protocol" }
shared_internals_for_server = { path = "../shared_internals_for_server" }
