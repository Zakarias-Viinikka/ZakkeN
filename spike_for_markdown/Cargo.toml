[package]
name = "spike_for_markdown"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.103"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.104", features = [
    "CustomEvent",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
] }
