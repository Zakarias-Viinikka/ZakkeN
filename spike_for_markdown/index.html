<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodeMirror 6 + yrs Markdown Spike</title>
    <link data-trunk rel="copy-dir" href="assets" />
    <script src="assets/cm_bridge.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 16px;
        background: #f8f9fa;
        color: #222;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
        padding: 10px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      button {
        padding: 5px 10px;
        cursor: pointer;
      }
      .block-card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .sync-ok {
        color: #1b7f37;
        font-weight: 700;
      }
      .sync-bad {
        color: #c01c28;
        font-weight: 700;
        background: #fde8e8;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .debug-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
        font-size: 12px;
      }
      .debug-box {
        background: #f4f5f7;
        padding: 6px;
        border-radius: 4px;
        overflow-x: auto;
      }
      pre {
        margin: 4px 0 0 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body></body>
</html>
