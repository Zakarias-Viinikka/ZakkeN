[package]
name = "api_example"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Window",
] }