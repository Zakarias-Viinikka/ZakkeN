[package]
name = "text_diff"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]   # cdylib needed for Android .so

[dependencies]
codee = "0.3.5"
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.20", features = ["csr"] }
leptos-use = "0.19.0"
leptos_router = "0.8.15"
web-sys = { version = "0.3.103", features = ["InputEvent"] }
uniffi = { version = "0.32", features = ["cli", "wasm-unstable-single-threaded"] } #the feature for the wasm unstanble thingy is because of doing uniffi and wasm32 in the same project
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[[test]]
name = "native"
path = "batching_tests/native.rs"

[[test]]
name = "web"
path = "batching_tests/web.rs"

[dev-dependencies]
wasm-bindgen-test = "0.3"
futures = "0.3"
